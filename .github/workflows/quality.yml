name: quality

on:
  push:
  pull_request:

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format python3
      - name: EditorConfig (basic)
        run: python3 scripts/check_editorconfig_basic.py
      - name: clang-format
        run: python3 scripts/check_clang_format.py
